name: Drift audit (atlascloud)

# Weekly, and deliberately separate from the fal refresh next door: this job hits
# Atlas Cloud's keyless catalog plus one keyless OpenAPI document per curated
# model, and its diffs need a human who can read a schema change.
#
# It is also the ONLY place Atlas drift is caught. `atlascloud` has no generator
# — the promotion bar is recorded in data/atlascloud/curation.json — so there is
# nothing offline to regenerate and nothing in ci.yml that would notice a moved
# enum. What there is instead is 23 committed snapshots under
# data/atlascloud/openapi/ and a set of hand-written tables in
# src/providers/atlascloud/constraints.ts transcribed from them. When Atlas moves
# a bound, those tables become a second opinion about a page that has changed,
# and this job is what says so.
#
# That the schedule is needed is not hypothetical: Atlas's own video API
# reference currently sends `"model": "kling-v2.0"`, an id that is not in the
# live catalog.
#
# Report-only by construction: `scripts/atlascloud-audit.ts` never writes a file.
# There is no PR to open, because there is nothing generated to regenerate — the
# fix is a human re-reading the changed schema and editing the tables.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # Exits non-zero when a curated model is GONE or its schema has moved;
      # roster growth and price movement are printed and do not fail the job.
      #
      # No credential: the catalog (api.atlascloud.ai/api/v1/models) and the
      # schema host (static.atlascloud.ai, robots.txt `Allow: /`) both answer
      # keyless, so this runs identically here and on a laptop.
      - name: Atlas roster and schema drift
        id: audit
        run: bun run audit:atlascloud

      # A failed audit is a real finding rather than a flaky job, so it gets an
      # issue with the log rather than a red check nobody opens.
      - name: Open an issue when a curated model moved
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "atlascloud: a curated model is gone or its schema moved";
            const body = [
              "The weekly Atlas Cloud drift audit failed.",
              "",
              "Either a curated model has vanished from `GET https://api.atlascloud.ai/api/v1/models`,",
              "or one of the 23 committed snapshots under `data/atlascloud/openapi/` no longer matches",
              "the live document at `https://static.atlascloud.ai/model/schema/<id-with-dashes>.json`.",
              "",
              "**Read the schema diff, not just the log.** The per-model tables in",
              "`src/providers/atlascloud/constraints.ts` were transcribed by hand from those snapshots:",
              "a changed enum, a tightened bound or a renamed field means those tables are now a second",
              "opinion about a page that has moved. Fix is: re-read the changed document, update the",
              "tables and `src/providers/atlascloud/video.ts`'s arms, re-commit the snapshot.",
              "",
              "Pricing is NOT the trigger here and never fails the job — Atlas publishes no usable price",
              "unit, so no `atlascloud` row ships a `cost` (see `data/atlascloud/pricing.json`). A moved",
              "listed figure is printed in the same log as a hint that the pricing page was touched.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "atlascloud-drift",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["atlascloud-drift"],
            });
