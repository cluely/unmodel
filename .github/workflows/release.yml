name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # Gate publishing on the same checks CI runs — CI is a separate,
      # non-blocking workflow, so a red commit must not reach npm.
      - run: bun run check
      - run: bun run bench:types
      - run: bun test
      - run: bun run build
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Emit an npm provenance attestation (uses the id-token: write
          # permission granted above; changeset publish shells out to npm).
          NPM_CONFIG_PROVENANCE: "true"
